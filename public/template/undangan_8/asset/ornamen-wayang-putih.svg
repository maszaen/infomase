<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 300" fill="none">
  <defs>
    <linearGradient id="wayangPearl" x1="30" y1="20" x2="180" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F1E4"/>
      <stop offset="100%" stop-color="#E7DBC5"/>
    </linearGradient>
    <linearGradient id="wayangGold" x1="20" y1="10" x2="190" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAD29B"/>
      <stop offset="50%" stop-color="#C49A4E"/>
      <stop offset="100%" stop-color="#966E29"/>
    </linearGradient>
    <filter id="wayangGlow" x="-14%" y="-10%" width="128%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A3A24" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#wayangGlow)">
    <!-- Gelung Supit Urang (Classic Curved Royal Wayang Headdress) -->
    <path d="M92 78 C64 56 58 22 86 14 C114 6 132 30 116 54 C104 42 94 26 84 30 C74 34 80 56 102 68 Z"
          fill="url(#wayangPearl)" stroke="url(#wayangGold)" stroke-width="2.4"/>
    <path d="M78 44 C76 28 92 20 106 30" stroke="url(#wayangGold)" stroke-width="1.4" stroke-dasharray="3 2"/>

    <!-- Praba / Royal Wing Ornament on Back -->
    <path d="M84 114 C46 96 34 64 46 46 C58 64 72 74 90 82 Z"
          fill="#FAF4E8" stroke="url(#wayangGold)" stroke-width="2"/>
    <path d="M76 126 C42 118 28 96 36 78 C48 92 64 100 84 104 Z"
          fill="#FFFFFF" stroke="url(#wayangGold)" stroke-width="1.8"/>

    <!-- Noble Wayang Profile Head & Crown (Jamang & Sumping) -->
    <path d="M102 66 L124 54 L128 68 L142 62 L138 78 L158 92 L142 96 L146 106 L124 108 L112 118 L94 104 Z"
          fill="url(#wayangPearl)" stroke="url(#wayangGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Narrow Elongated Wayang Eye -->
    <path d="M126 84 L140 87 L128 89 Z" fill="#8E6928"/>
    <!-- Sumping Ear Filigree -->
    <path d="M104 92 C92 84 88 70 98 64 C102 74 106 82 112 88" fill="#F5E5C3" stroke="url(#wayangGold)" stroke-width="1.6"/>

    <!-- Torso & Kalung Ulur Gold Necklace -->
    <path d="M86 116 L132 118 L124 174 L92 174 Z"
          fill="url(#wayangPearl)" stroke="url(#wayangGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M94 118 Q109 144 126 118" stroke="url(#wayangGold)" stroke-width="2" fill="none"/>
    <path d="M98 124 Q109 156 122 124" stroke="url(#wayangGold)" stroke-width="1.3" stroke-dasharray="2 2" fill="none"/>

    <!-- Articulated Wayang Arms & Tuding Rods -->
    <path d="M86 120 L58 158 L88 182" stroke="url(#wayangGold)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 120 L158 162 L138 196" stroke="url(#wayangGold)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="158" r="3.5" fill="#FFFFFF" stroke="url(#wayangGold)" stroke-width="1.6"/>
    <circle cx="158" cy="162" r="3.5" fill="#FFFFFF" stroke="url(#wayangGold)" stroke-width="1.6"/>
    <!-- Fine Dalang Control Sticks (Cempurit) -->
    <line x1="138" y1="196" x2="166" y2="278" stroke="#B99149" stroke-width="1.5"/>
    <line x1="108" y1="112" x2="96" y2="288" stroke="#A67E38" stroke-width="2.2"/>

    <!-- Dodot / Kain Kampuh Batik Putih & Prada Gold Skirt -->
    <path d="M90 174 L126 174 C144 202 152 238 142 268 L74 268 C64 238 72 202 90 174 Z"
          fill="url(#wayangPearl)" stroke="url(#wayangGold)" stroke-width="2.2"/>
    <!-- Batik Kawung / Parang Filigree Lines Inside Skirt -->
    <path d="M86 196 L132 214 M80 218 L138 238 M78 242 L136 260" stroke="url(#wayangGold)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Flowing Sampur Sash -->
    <path d="M90 178 C66 196 52 228 58 258 C68 246 76 232 80 214" fill="#FAF4E6" stroke="url(#wayangGold)" stroke-width="1.8"/>

    <!-- Pedestal Base -->
    <rect x="66" y="268" width="84" height="8" rx="4" fill="url(#wayangGold)"/>
  </g>
</svg>
