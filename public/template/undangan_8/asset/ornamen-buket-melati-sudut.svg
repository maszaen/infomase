<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
  <defs>
    <linearGradient id="orchidPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#EAE0CE"/>
    </linearGradient>
    <linearGradient id="batikLeafGold" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECD39D"/>
      <stop offset="52%" stop-color="#C69C50"/>
      <stop offset="100%" stop-color="#9A722C"/>
    </linearGradient>
    <filter id="bouquetDrop" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#4A3B28" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#bouquetDrop)">
    <!-- Sweeping Batik Lung-lungan Gold Filigree Vines from Top-Left Corner -->
    <path d="M8 8 C64 14 132 34 198 78" stroke="url(#batikLeafGold)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8 8 C14 66 34 132 76 198" stroke="url(#batikLeafGold)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 22 C84 56 124 98 156 154" stroke="url(#batikLeafGold)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Pearl-Batik Leaves (Horizontal Branch) -->
    <path d="M112 34 C138 14 176 16 198 38 C172 52 138 50 112 34 Z" fill="#F8F3E8" stroke="url(#batikLeafGold)" stroke-width="1.6"/>
    <path d="M126 34 L182 36" stroke="url(#batikLeafGold)" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M152 54 C178 44 212 54 228 78 C198 84 170 74 152 54 Z" fill="#FFFFFF" stroke="url(#batikLeafGold)" stroke-width="1.5"/>

    <!-- Pearl-Batik Leaves (Vertical Branch) -->
    <path d="M34 112 C14 138 16 176 38 198 C52 172 50 138 34 112 Z" fill="#F8F3E8" stroke="url(#batikLeafGold)" stroke-width="1.6"/>
    <path d="M34 126 L36 182" stroke="url(#batikLeafGold)" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M54 152 C44 178 54 212 78 228 C84 198 74 170 54 152 Z" fill="#FFFFFF" stroke="url(#batikLeafGold)" stroke-width="1.5"/>

    <!-- Large White Phalaenopsis Orchid / Sekar Ageng (Corner Focal) -->
    <g transform="translate(64 64)">
      <ellipse cx="0" cy="-26" rx="18" ry="26" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <ellipse cx="26" cy="-6" rx="26" ry="18" transform="rotate(-15 26 -6)" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <ellipse cx="-24" cy="10" rx="25" ry="18" transform="rotate(-25 -24 10)" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <ellipse cx="16" cy="24" rx="17" ry="24" transform="rotate(-20 16 24)" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <ellipse cx="-8" cy="26" rx="16" ry="22" transform="rotate(20 -8 26)" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="10" fill="#F5E5C2" stroke="url(#batikLeafGold)" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="4.5" fill="#C69C50"/>
    </g>

    <!-- Secondary White Melati Blossom (Right) -->
    <g transform="translate(128 84) scale(0.76)">
      <circle cx="0" cy="-16" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="16" cy="0" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="0" cy="16" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="-16" cy="0" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="7" fill="url(#batikLeafGold)"/>
    </g>

    <!-- Secondary White Melati Blossom (Bottom) -->
    <g transform="translate(84 128) scale(0.72)">
      <circle cx="0" cy="-16" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="16" cy="0" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="0" cy="16" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="-16" cy="0" r="13" fill="url(#orchidPearl)" stroke="#DFC592" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="7" fill="url(#batikLeafGold)"/>
    </g>

    <!-- Delicate Jasmine Buds & Gold Prada Berries -->
    <g fill="#FFFFFF" stroke="url(#batikLeafGold)" stroke-width="1.3">
      <circle cx="172" cy="96" r="6"/>
      <circle cx="198" cy="108" r="4.5"/>
      <circle cx="96" cy="172" r="6"/>
      <circle cx="108" cy="198" r="4.5"/>
      <circle cx="142" cy="142" r="7"/>
    </g>
    <g fill="#C69C50">
      <circle cx="214" cy="84" r="3"/>
      <circle cx="84" cy="214" r="3"/>
      <circle cx="164" cy="164" r="3.5"/>
    </g>
  </g>
</svg>
