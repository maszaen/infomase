      <ellipse cx="32" cy="54" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="72" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="90" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="108" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="126" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="144" rx="5.5" ry="7.5"/>
      <ellipse cx="32" cy="162" rx="5.5" ry="7.5"/>
