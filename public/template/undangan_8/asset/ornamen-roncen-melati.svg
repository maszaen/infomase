      <ellipse cx="75" cy="107" rx="6.2" ry="8.5"/>
      <ellipse cx="75" cy="128" rx="6.2" ry="8.5"/>
      <ellipse cx="75" cy="149" rx="6.2" ry="8.5"/>
      <ellipse cx="75" cy="170" rx="6.2" ry="8.5"/>
      <ellipse cx="75" cy="191" rx="6.2" ry="8.5"/>
