<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 320" fill="none">
  <defs>
    <radialGradient id="melatiBead" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F6F1E6"/>
      <stop offset="100%" stop-color="#E2D6C1"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDD5A1"/>
      <stop offset="55%" stop-color="#C59A4D"/>
      <stop offset="100%" stop-color="#966E2A"/>
    </linearGradient>
    <filter id="melatiShadow" x="-20%" y="-6%" width="140%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A3B28" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#melatiShadow)">
