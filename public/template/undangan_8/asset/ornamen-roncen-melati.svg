      <path d="M0 17 L-5 36 L0 32 L5 36 Z" fill="url(#goldCap)"/>
    </g>

    <!-- RIGHT STRAND (Shorter Delicate Drop) -->
    <line x1="118" y1="18" x2="118" y2="152" stroke="#D3B173" stroke-width="1.3"/>
    <g fill="url(#melatiBead)" stroke="#DEC89E" stroke-width="0.9">
      <ellipse cx="118" cy="36" rx="5" ry="7"/>
      <ellipse cx="118" cy="53" rx="5" ry="7"/>
      <ellipse cx="118" cy="70" rx="5" ry="7"/>
      <ellipse cx="118" cy="87" rx="5" ry="7"/>
      <ellipse cx="118" cy="104" rx="5" ry="7"/>
